name: SETU Contract

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

env:
  PUPPETEER_SKIP_DOWNLOAD: '1'

jobs:
  selfhost:
    name: Self-hosted contract tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:selfhost
